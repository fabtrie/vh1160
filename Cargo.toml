[workspace]
resolver = "2"
members = ["crates/vh1160-core", "crates/vh1160-cli", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
vh1160-core = { path = "crates/vh1160-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
